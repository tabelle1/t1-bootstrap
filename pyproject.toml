[project]
name = "t1-bootstrap"
version = "0.1.0"
description = "A modern TUI for starting Python projects: venv, src layout, and the directories you always end up creating anyway."
readme = "README.md"
requires-python = ">=3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Philipp Formanek", email = "hello@tabelle1.at" }]
keywords = ["tui", "scaffold", "bootstrap", "uv", "textual", "project-template"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Code Generators",
    "Typing :: Typed",
]
dependencies = ["textual>=6.0", "rich>=13.3.3"]

[project.urls]
Homepage = "https://tabelle1.at"
Repository = "https://github.com/tabelle1/t1-bootstrap"
Issues = "https://github.com/tabelle1/t1-bootstrap/issues"
Changelog = "https://github.com/tabelle1/t1-bootstrap/blob/main/CHANGELOG.md"

[project.scripts]
t1 = "t1_bootstrap.cli:main"
t1-bootstrap = "t1_bootstrap.cli:main"

[build-system]
requires = ["uv_build>=0.9.30,<0.10.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14",
    "textual-dev>=1.7",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "RUF", "PTH", "RET", "ARG"]
ignore = [
    "E501",   # the formatter owns line length
    "RUF001", # ·, –, › are deliberate UI typography
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["ARG"]

[tool.ruff.lint.isort]
known-first-party = ["t1_bootstrap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --strict-config"
asyncio_mode = "auto"
