name: CI

# Every push to main and every pull request. Also callable by publish.yml, so a
# release runs exactly the checks a PR ran - defined once, not copied.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  # Superseded PR pushes are worth cancelling. A release run is not.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    # ruff is pinned and target-version is fixed, so linting once above is
    # enough; this matrix is about the interpreters and the two OSes we claim.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
      - run: uv sync --locked --python ${{ matrix.python-version }}
      - run: uv run --python ${{ matrix.python-version }} pytest -q
