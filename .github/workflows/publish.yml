name: Publish

# Tag a release and it ships:  git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  # The same lint + test matrix a pull request gets. Nothing ships that a PR
  # would not have caught.
  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1

      # A tag that disagrees with pyproject.toml is a mis-cut release. Stop here,
      # not after PyPI has permanently taken the version.
      - name: Tag matches the packaged version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tagged="${GITHUB_REF_NAME#v}"
          packaged="$(uv version --short)"
          if [ "$tagged" != "$packaged" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match version $packaged in pyproject.toml"
            exit 1
          fi

      # An undocumented release is a broken release. Check the notes exist
      # while the version is still retractable.
      - name: Changelog has a section for this version
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 scripts/changelog_section.py "$GITHUB_REF_NAME" > /dev/null

      - run: uv build
      - run: uvx twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Trusted Publishing mints a short-lived token from this. No API key in
      # the repo, nothing to rotate, nothing to leak.
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: astral-sh/setup-uv@v10.0.1
      - run: uv publish --trusted-publishing always

  # PyPI has the package; now give the tag a readable home on GitHub. Notes come
  # from the changelog, so the release and the changelog cannot disagree.
  release:
    needs: publish
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/changelog_section.py "$GITHUB_REF_NAME" > notes.md
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --verify-tag \
            dist/*
